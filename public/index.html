<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Salon Visagista — Admin</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visagista">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box; margin:0; padding:0;}
:root{
  --black:#0a0a0a;
  --black2:#111111;
  --black3:#1a1a1a;
  --gold:#c9a96e;
  --gold2:#e8c98a;
  --white:#ffffff;
  --off-white:#f5f2ee;
  --gray:#888888;
  --gray2:#444444;
  --glass:rgba(255,255,255,0.04);
  --glass-bd:rgba(201,169,110,0.2);
  --danger:#c0392b;
  --success:#2e7d4f;
}
body{font-family:'Montserrat',sans-serif; background:var(--black); color:var(--white); min-height:100vh; overflow-x:hidden;}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;}

/* ── APP SHELL ── */
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
.screen{flex:1; display:flex; flex-direction:column; overflow-y:auto; padding-bottom:80px; -webkit-overflow-scrolling:touch; transform:translateZ(0);}

/* ── HOME CARDS ── */
.home-screen{min-height:100vh; display:flex; flex-direction:column; background:radial-gradient(ellipse at 50% 0%, rgba(201,169,110,0.07) 0%, transparent 60%);}
.home-header{padding:40px 24px 32px; text-align:center; border-bottom:1px solid var(--glass-bd);}
.home-brand{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; letter-spacing:4px; text-transform:uppercase; color:var(--white);}
.home-subtitle{font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-top:6px;}
.home-cards{padding:28px 20px; display:flex; flex-direction:column; gap:14px;}
.home-card{padding:22px 20px; background:var(--glass); border:1px solid var(--glass-bd); border-left:2px solid var(--gold); cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:.2s; position:relative;}
.home-card:active{background:rgba(201,169,110,0.08);}
.home-card-left{}
.home-card-title{font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; letter-spacing:2px; text-transform:uppercase;}
.home-card-sub{font-size:10px; color:var(--gray); letter-spacing:.5px; margin-top:5px;}
.home-card-arrow{color:var(--gold); opacity:.6;}
.home-card-badge{position:absolute; top:12px; right:40px; background:var(--danger); color:#fff; font-size:9px; font-weight:600; padding:3px 7px; border-radius:10px; letter-spacing:.5px;}

/* ── STAT CARDS ── */
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; margin:0 20px 24px;}
.stats-card{background:var(--glass); border:1px solid var(--glass-bd); padding:18px 14px; text-align:center;}
.stats-num{font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:300; color:var(--gold);}
.stats-lbl{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gray); margin-top:4px;}
.ranking-row{margin:0 20px 10px; padding:14px 16px; background:var(--glass); border:1px solid var(--glass-bd); display:flex; align-items:center; gap:14px;}
.ranking-num{font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--gold); width:28px; text-align:center;}
.ranking-info{flex:1;}
.ranking-name{font-family:'Cormorant Garamond',serif; font-size:17px;}
.ranking-sub{font-size:10px; color:var(--gray); margin-top:2px;}

/* ── TOPBAR ── */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--glass-bd); background:var(--black); position:sticky; top:0; z-index:50;}
.topbar h2{font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:400; letter-spacing:2px; text-transform:uppercase;}
.topbar-logo{font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:300; letter-spacing:3px; text-transform:uppercase; color:var(--gold);}
.back-btn{width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gold);}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--black2); border-top:1px solid var(--glass-bd); display:flex; z-index:100;}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 0; gap:4px; cursor:pointer; color:var(--gray); transition:.2s;}
.nav-item.active{color:var(--gold);}
.nav-item span{font-size:9px; letter-spacing:1px; text-transform:uppercase; font-weight:500;}
.nav-item svg{width:20px; height:20px;}

/* ── LOGIN ── */
.login-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 32px; background:radial-gradient(ellipse at 50% 30%, rgba(201,169,110,0.08) 0%, transparent 70%);}
.login-brand{text-align:center; margin-bottom:48px;}
.login-brand h1{font-family:'Cormorant Garamond',serif; font-size:38px; font-weight:300; letter-spacing:4px; text-transform:uppercase; color:var(--white); line-height:1.2;}
.login-brand p{font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-top:8px;}
.login-divider{width:40px; height:1px; background:var(--gold); margin:16px auto;}
.login-form{width:100%;}
.login-input{width:100%; background:transparent; border:none; border-bottom:1px solid var(--glass-bd); padding:14px 0; font-size:14px; color:var(--white); font-family:'Montserrat',sans-serif; letter-spacing:1px; outline:none; transition:.3s;}
.login-input:focus{border-bottom-color:var(--gold);}
.login-input::placeholder{color:var(--gray); letter-spacing:1px;}
.login-btn{width:100%; margin-top:32px; padding:16px; background:var(--gold); color:var(--black); font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600; letter-spacing:3px; text-transform:uppercase; border:none; cursor:pointer; transition:.2s;}
.login-btn:active{background:var(--gold2);}

/* ── CARDS ── */
.client-card{margin:0 20px 12px; padding:18px 20px; background:var(--glass); border:1px solid var(--glass-bd); border-left:2px solid var(--gold); cursor:pointer; transition:.2s;}
.client-card:active{background:rgba(201,169,110,0.08);}
.client-card-name{font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:400; letter-spacing:1px; margin-bottom:4px;}
.client-card-sub{font-size:11px; color:var(--gray); letter-spacing:.5px;}
.client-card-badge{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-top:6px;}

/* ── SECTION HEADER ── */
.section-header{padding:28px 20px 12px; display:flex; align-items:flex-end; justify-content:space-between;}
.section-title{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; letter-spacing:2px; text-transform:uppercase;}
.section-count{font-size:11px; color:var(--gray); letter-spacing:1px;}

/* ── SEARCH ── */
.search-wrap{margin:0 20px 16px; border-bottom:1px solid var(--glass-bd); display:flex; align-items:center; gap:10px; padding-bottom:2px;}
.search-wrap svg{width:18px; height:18px; flex-shrink:0; color:var(--gray);}
.search-input{flex:1; background:transparent; border:none; outline:none; color:var(--white); font-family:'Montserrat',sans-serif; font-size:13px; letter-spacing:.5px; padding:10px 0;}
.search-input::placeholder{color:var(--gray);}

/* ── FORMS ── */
.form-section{padding:20px;}
.form-group{margin-bottom:20px;}
.form-label{font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:8px;}
.form-input{width:100%; background:transparent; border:none; border-bottom:1px solid var(--glass-bd); padding:10px 0; font-size:14px; color:var(--white); font-family:'Montserrat',sans-serif; outline:none; transition:.3s;}
.form-input:focus{border-bottom-color:var(--gold);}
.form-input::placeholder{color:var(--gray);}
textarea.form-input{resize:none; min-height:80px; border:1px solid var(--glass-bd); padding:10px; margin-top:4px;}
textarea.form-input:focus{border-color:var(--gold);}

/* ── BUTTONS ── */
.btn-gold{background:var(--gold); color:var(--black); font-family:'Montserrat',sans-serif; font-size:10px; font-weight:600; letter-spacing:3px; text-transform:uppercase; border:none; padding:15px 24px; cursor:pointer; width:100%; transition:.2s;}
.btn-gold:active{background:var(--gold2);}
.btn-outline{background:transparent; color:var(--gold); border:1px solid var(--glass-bd); font-family:'Montserrat',sans-serif; font-size:10px; font-weight:500; letter-spacing:2px; text-transform:uppercase; padding:13px 20px; cursor:pointer; width:100%; transition:.2s;}
.btn-outline:active{border-color:var(--gold); background:rgba(201,169,110,0.06);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(192,57,43,0.3); font-family:'Montserrat',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; padding:13px 20px; cursor:pointer; width:100%;}
.icon-btn{width:36px; height:36px; border:1px solid var(--glass-bd); background:var(--glass); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--gray); transition:.2s;}
.icon-btn:hover{border-color:var(--gold); color:var(--gold);}

/* ── FAB ── */
.fab{position:fixed; bottom:90px; right:calc(50% - 240px + 20px); width:52px; height:52px; background:var(--gold); color:var(--black); border:none; font-size:24px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:200; box-shadow:0 4px 20px rgba(201,169,110,0.4);}

/* ── TRATAMIENTO ROW ── */
.trat-row{margin:0 20px 10px; padding:16px; background:var(--glass); border:1px solid var(--glass-bd); cursor:pointer;}
.trat-date{font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
.trat-service{font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:400; letter-spacing:.5px; margin-bottom:4px;}
.trat-obs{font-size:12px; color:var(--gray); line-height:1.5; margin-top:4px;}

/* ── PHOTO UPLOAD ── */
.photo-upload-area{margin:0 0 20px; border:1px dashed var(--glass-bd); padding:24px; text-align:center; cursor:pointer; position:relative; transition:.2s;}
.photo-upload-area:hover{border-color:var(--gold);}
.photo-upload-area input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.photo-upload-label{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--gray);}
.photo-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px;}
.photo-thumb{aspect-ratio:1; position:relative; overflow:hidden;}
.photo-thumb img{width:100%; height:100%; object-fit:cover;}
.photo-thumb-del{position:absolute; top:4px; right:4px; width:24px; height:24px; background:rgba(0,0,0,0.7); color:#fff; border:none; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;}

/* ── MODAL ── */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:500; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{width:100%; max-width:480px; background:var(--black2); border-top:1px solid var(--glass-bd); padding:24px 20px; max-height:90vh; overflow-y:auto;}
.modal-title{font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--glass-bd);}

/* ── TOAST ── */
.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--black); padding:12px 24px; font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:600; z-index:1000; opacity:0; transition:opacity .3s; pointer-events:none;}
.toast.show{opacity:1;}

/* ── EMPTY STATE ── */
.empty-state{padding:60px 20px; text-align:center;}
.empty-state p{font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:300; color:var(--gray); letter-spacing:1px;}
.empty-state-sub{font-size:11px; letter-spacing:1px; color:var(--gray2); margin-top:8px;}

/* ── DETAIL HEADER ── */
.detail-header{padding:24px 20px; border-bottom:1px solid var(--glass-bd);}
.detail-name{font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:300; letter-spacing:2px; margin-bottom:6px;}
.detail-info{font-size:12px; color:var(--gray); letter-spacing:.5px; line-height:1.8;}
.detail-gold{color:var(--gold);}

/* ── TAGS ── */
.tag{display:inline-block; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:4px 10px; border:1px solid var(--glass-bd); color:var(--gray); margin:2px;}
.tag.active{border-color:var(--gold); color:var(--gold);}

/* ── DIVIDER ── */
.divider{height:1px; background:var(--glass-bd); margin:0 20px;}
.gold-line{width:32px; height:1px; background:var(--gold); margin:12px 0;}

/* ── STAT ROW ── */
.stat-row{display:flex; gap:1px; margin:0 20px 20px;}
.stat-box{flex:1; background:var(--glass); border:1px solid var(--glass-bd); padding:16px 12px; text-align:center;}
.stat-num{font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; color:var(--gold);}
.stat-lbl{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gray); margin-top:4px;}

/* ── NOTIFICATION PREVIEW ── */
.notif-preview{margin:0 0 16px; padding:16px; background:rgba(201,169,110,0.06); border:1px solid rgba(201,169,110,0.25);}
.notif-preview-label{font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
.notif-preview-text{font-size:13px; color:rgba(255,255,255,0.8); line-height:1.6;}

/* ── LOADING ── */
.loading-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
.loading-dot{width:6px; height:6px; background:var(--gold); border-radius:50%; animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.2;}50%{opacity:1;}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--glass-bd);}

/* ── STOCK ── */
.stock-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;margin:16px 20px;}
.stock-stat{background:var(--glass);border:1px solid var(--glass-bd);padding:16px 10px;text-align:center;}
.stock-stat-num{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--gold);}
.stock-stat-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-top:3px;}
.stock-cat-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);padding:20px 20px 6px;opacity:.7;}
.stock-item{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:.15s;}
.stock-item:active{background:var(--glass);}
.stock-item-left{flex:1;}
.stock-item-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:400;}
.stock-item-brand{font-size:10px;color:var(--gray);margin-top:2px;letter-spacing:.3px;}
.stock-badge{padding:4px 12px;font-size:11px;font-weight:600;border-radius:20px;white-space:nowrap;}
.stock-badge.ok{background:rgba(46,125,79,0.2);color:#5cb85c;border:1px solid rgba(92,184,92,0.25);}
.stock-badge.low{background:rgba(215,153,33,0.18);color:#e6a817;border:1px solid rgba(230,168,23,0.25);}
.stock-badge.out{background:rgba(192,57,43,0.18);color:#e74c3c;border:1px solid rgba(231,76,60,0.25);}
.stock-fab{position:fixed;bottom:88px;right:20px;width:54px;height:54px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px rgba(201,169,110,0.4);z-index:80;border:none;}
.stock-fab svg{width:24px;height:24px;color:var(--black);}
.stock-mov-btn{flex:1;padding:16px;border:none;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.stock-mov-btn.entrada{background:var(--success);color:#fff;}
.stock-mov-btn.salida{background:var(--danger);color:#fff;}
.mov-list-item{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;}
.mov-tipo{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border-radius:10px;}
.mov-tipo.entrada{background:rgba(46,125,79,0.2);color:#5cb85c;}
.mov-tipo.salida{background:rgba(192,57,43,0.18);color:#e74c3c;}
.mov-qty{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;}
.mov-meta{font-size:10px;color:var(--gray);margin-top:2px;}
/* Scanner */
.scanner-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;}
.scanner-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(0,0,0,0.7);position:absolute;top:0;left:0;right:0;z-index:201;}
.scanner-close{color:#fff;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:22px;}
.scanner-viewport{flex:1;position:relative;}
.scanner-viewport video{width:100%;height:100%;object-fit:cover;}
#qr-reader{border:none!important;padding:0!important;background:#000!important;}
#qr-reader video{width:100%!important;object-fit:cover!important;}
#qr-reader__dashboard_section_swaplink{display:none!important;}
#qr-reader__status_span{color:rgba(255,255,255,0.5)!important;font-size:11px!important;font-family:'Montserrat',sans-serif!important;}
#qr-reader__header_message{display:none!important;}
.scanner-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:260px;height:150px;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(0,0,0,0.55);}
.scanner-corner{position:absolute;width:22px;height:22px;border-color:var(--gold2);border-style:solid;}
.scanner-corner.tl{top:-3px;left:-3px;border-width:3px 0 0 3px;}
.scanner-corner.tr{top:-3px;right:-3px;border-width:3px 3px 0 0;}
.scanner-corner.bl{bottom:-3px;left:-3px;border-width:0 0 3px 3px;}
.scanner-corner.br{bottom:-3px;right:-3px;border-width:0 3px 3px 0;}
.scanner-hint{position:absolute;top:calc(50% + 20px);left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.6);font-size:11px;letter-spacing:1px;text-align:center;width:240px;}
.scanner-manual{position:absolute;bottom:100px;left:20px;right:20px;}
.scanner-manual input{width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:13px 16px;font-size:16px;text-align:center;letter-spacing:3px;border-radius:0;}
.scanner-manual-btn{width:100%;background:var(--gold);color:var(--black);padding:13px;font-weight:700;font-size:12px;letter-spacing:2px;margin-top:8px;cursor:pointer;border:none;text-transform:uppercase;}
/* Modal */
.qty-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:150;display:flex;align-items:flex-end;}
.qty-sheet{background:var(--black2);width:100%;padding:28px 24px 44px;border-top:1px solid var(--glass-bd);}
.qty-sheet h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin-bottom:6px;}
.qty-sheet .sub{font-size:11px;color:var(--gray);letter-spacing:.5px;margin-bottom:24px;}
.qty-row{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:20px;}
.qty-btn{width:44px;height:44px;background:var(--glass);border:1px solid var(--glass-bd);color:var(--white);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0;line-height:1;}
.qty-num{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;min-width:80px;text-align:center;line-height:1;}
.qty-nota{width:100%;background:var(--glass);border:1px solid var(--glass-bd);color:var(--white);padding:12px 14px;font-size:13px;margin-bottom:16px;font-family:'Montserrat',sans-serif;}
/* Form */
.stock-form{padding:20px;}
.sform-group{margin-bottom:18px;}
.sform-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:block;}
.sform-input{width:100%;background:var(--glass);border:1px solid var(--glass-bd);color:var(--white);padding:13px 14px;font-size:14px;font-family:'Montserrat',sans-serif;border-radius:0;}
.sform-input:focus{outline:none;border-color:var(--gold);}
.sform-select{width:100%;background:var(--black3);border:1px solid var(--glass-bd);color:var(--white);padding:13px 14px;font-size:14px;font-family:'Montserrat',sans-serif;border-radius:0;appearance:none;}
.sform-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── SUPABASE API ── */
async function sbFetch(path, method="GET", body=null, prefer=""){
  const opts = {
    method,
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
    }
  };
  if(prefer) opts.headers['Prefer'] = prefer;
  if(body != null) opts.body = JSON.stringify(body);
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, opts);
  if(!res.ok){ const t = await res.text(); throw new Error(t); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* ── SUPABASE DATA LAYER ── */
async function loadClientes(){
  state.loading = true; render();
  try{
    const data = await sbFetch('clientes?select=*,tratamientos(id,servicio,fecha)&order=nombre.asc');
    state.clientes = (data||[]).map(c=>({
      ...c,
      tratamientos: (c.tratamientos||[]).sort((a,b)=>a.fecha.localeCompare(b.fecha))
    }));
    checkPendientes();
  }catch(e){ console.error(e); toast("Error al cargar datos"); }
  state.loading = false; render();
}

function checkPendientes(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  state.pendientes = [];
  for(const c of state.clientes){
    if(c.proxima_cita_fecha){
      const citaDate = new Date(c.proxima_cita_fecha+'T00:00:00');
      const diasHasta = Math.round((citaDate - hoy)/(1000*60*60*24));
      const aviso = c.dias_aviso ?? 2;
      if(diasHasta === aviso || diasHasta === 0){
        const hora = c.proxima_cita_hora ? ' a las '+c.proxima_cita_hora.slice(0,5) : '';
        const msg = c.msg_recordatorio || `Hola ${c.nombre.split(' ')[0]}! 💛 Te recordamos tu turno en Salon Visagista el ${formatDate(c.proxima_cita_fecha)}${hora}. ¡Te esperamos!`;
        state.pendientes.push({tipo:'cita', cliente:c, diasHasta, mensaje:msg});
      }
    }
    if(c.fecha_nacimiento){
      const [,mesNac,diaNac] = c.fecha_nacimiento.split('-');
      const mesHoy = String(hoy.getMonth()+1).padStart(2,'0');
      const diaHoy = String(hoy.getDate()).padStart(2,'0');
      if(mesNac===mesHoy && diaNac===diaHoy){
        const msg = c.msg_cumpleanos || `Hola ${c.nombre.split(' ')[0]}! 🎂 ¡Feliz cumpleaños de parte de todo el equipo de Salon Visagista! Que sea un día hermoso. ✨`;
        state.pendientes.push({tipo:'cumple', cliente:c, mensaje:msg});
      }
    }
  }
}

async function loadTratamientos(clienteId){
  try{
    const data = await sbFetch(`tratamientos?cliente_id=eq.${clienteId}&select=*&order=fecha.desc`);
    state.tratCache[clienteId] = data||[];
  }catch(e){ console.error(e); toast("Error al cargar historial"); }
}

/* ── TOAST ── */
function toast(msg){
  const el = document.getElementById("toast-el");
  el.textContent = msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 2800);
}

/* ── RENDER ── */
function render(){
  const app = document.getElementById("app");
  if(!state.authed){ app.innerHTML = renderLogin(); return; }
  if(state.loading){
    app.innerHTML = `<div class="loading-screen">
      <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);letter-spacing:4px;text-transform:uppercase;">Salon Visagista</div>
      <div class="loading-dot"></div>
    </div>`;
    return;
  }
  const s = state.route.screen;
  let content = "";
  let showNav = true;
  if(s==="home")                  content = renderHome();
  else if(s==="clientes")         content = renderClientes();
  else if(s==="notificaciones")   content = renderNotificaciones();
  else if(s==="estadisticas")     content = renderEstadisticas();
  else if(s==="cliente-detail")   content = renderClienteDetail(state.route.id);
  else if(s==="tratamiento-detail") content = renderTratamientoDetail(state.route.clienteId, state.route.tratId);
  else if(s==="nuevo-tratamiento") content = renderNuevoTratamiento(state.route.clienteId);
  else if(s==="stock")            content = renderStock();
  else if(s==="stock-detalle")    content = renderStockDetalle(state.route.id);
  else if(s==="stock-form")       content = renderStockForm();
  else content = renderHome();
  app.innerHTML = content + renderBottomNav();
}

async function nav(screen, params={}){
  state.route = {screen, ...params};
  render();
  if(screen==="cliente-detail"){
    await loadTratamientos(params.id);
    render();
  }
}
function navHome(){ state.route={screen:"home"}; render(); }

  return `

    </div>

function doLogin(){
  const v = document.getElementById("login-pass").value;
  if(v===ADMIN_PASS){
    state.authed=true; state.route={screen:"home"};
    saveAuth(); render(); loadClientes();
  } else toast("Contraseña incorrecta");
}
function doLogout(){ if(confirm('¿Cerrar sesión?')){ state.authed=false; state.clientes=[]; state.tratCache={}; saveAuth(); render(); } }

      ${homeIcon}<span>Inicio</span>

      ${ic('clients')}<span>Clientas</span>

        </div>
        <div class="home-card-arrow">${arrowSvg}</div>

      <div class="home-card" onclick="nav('stock')">
        <div class="home-card-left">

/* ── ESTADÍSTICAS ── */
function renderEstadisticas(){
  const clientes = state.clientes;
  const totalVisitas = clientes.reduce((s,c)=>s+(c.tratamientos||[]).length,0);
  const todosServicios = clientes.flatMap(c=>(c.tratamientos||[]).map(t=>t.servicio));
  const conteoServ = {};
  todosServicios.forEach(s=>{ conteoServ[s]=(conteoServ[s]||0)+1; });
  const topServicio = Object.entries(conteoServ).sort((a,b)=>b[1]-a[1])[0];
  const hoy = new Date();
  const mesHoy = String(hoy.getMonth()+1).padStart(2,'0');
  const anoHoy = hoy.getFullYear();
  const visitasMes = clientes.reduce((s,c)=>{
    return s+(c.tratamientos||[]).filter(t=>t.fecha&&t.fecha.startsWith(`${anoHoy}-${mesHoy}`)).length;
  },0);
  const ranking = clientes.map(c=>({...c,count:(c.tratamientos||[]).length})).filter(c=>c.count>0).sort((a,b)=>b.count-a.count).slice(0,10);
  const meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `
  <div class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="navHome()">${ic('chevron')}</button>
      <h2 style="font-size:14px;letter-spacing:1px;">Estadísticas</h2>
      <div style="width:36px;"></div>
    </div>
    <div class="section-header" style="padding-top:20px;">
      <span class="section-title" style="font-size:22px;">General</span>
    </div>
    <div class="stats-grid">
      <div class="stats-card"><div class="stats-num">${clientes.length}</div><div class="stats-lbl">Clientas</div></div>
      <div class="stats-card"><div class="stats-num">${totalVisitas}</div><div class="stats-lbl">Visitas totales</div></div>
      <div class="stats-card"><div class="stats-num">${visitasMes}</div><div class="stats-lbl">Visitas ${meses[hoy.getMonth()]}</div></div>
      <div class="stats-card"><div class="stats-num">${clientes.filter(c=>c.proxima_cita_fecha).length}</div><div class="stats-lbl">Turnos agendados</div></div>
    </div>
    ${topServicio?`
    <div style="margin:0 20px 24px;padding:16px;background:var(--glass);border:1px solid var(--glass-bd);">
      <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;">Servicio más popular</div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:22px;">${topServicio[0]}</div>
      <div style="font-size:11px;color:var(--gray);margin-top:3px;">${topServicio[1]} vez${topServicio[1]!==1?'ces':''}</div>
    </div>`:''}
    ${ranking.length>0?`
    <div class="section-header" style="padding-top:4px;">
      <span class="section-title" style="font-size:22px;">Ranking Clientas</span>
    </div>
    ${ranking.map((c,i)=>`
      <div class="ranking-row" onclick="nav('cliente-detail',{id:'${c.id}'})">
        <div class="ranking-num">${i+1}</div>
        <div class="ranking-info">
          <div class="ranking-name">${c.nombre}</div>
          <div class="ranking-sub">${c.count} visita${c.count!==1?'s':''} · Último: ${c.tratamientos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]?.servicio||''}</div>
        </div>
      </div>`).join('')}
    `:'<div class="empty-state"><p>Sin datos aún</p></div>'}
  </div>`;
}

/* ── CLIENTES LIST ── */
function renderClientes(){
  return `
  <div class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="navHome()">${ic('chevron')}</button>
      <h2 style="font-size:14px;letter-spacing:2px;">Clientas</h2>
      <button class="icon-btn" onclick="loadClientes()" style="border:none;background:none;color:var(--gray);">

      </button>
    </div>

      <span class="section-title">Clientas</span>
      <span class="section-count">${state.clientes.length} registradas</span>
    </div>
    <div class="search-wrap" style="margin:0 20px 16px;">
      ${ic('search')}
      <input class="search-input" placeholder="Buscar clienta…" value="${state.clienteQ||''}"
        oninput="state.clienteQ=this.value; document.getElementById('clientes-list').innerHTML=renderClientesList()">
    </div>
    <div id="clientes-list">${renderClientesList()}</div>
    <button class="fab" onclick="openNuevaClientaModal()">${ic('plus')}</button>
  </div>`;
}
function renderClientesList(){
  const q = (state.clienteQ||'').toLowerCase().trim();
  const list = q ? state.clientes.filter(c=>c.nombre.toLowerCase().includes(q)||(c.telefono||'').includes(q)) : state.clientes;
  if(list.length===0) return `<div class="empty-state"><p>Sin clientas aún</p><div class="empty-state-sub">Tocá + para agregar la primera</div></div>`;
  return list.map(c=>{
    const tratCount = (c.tratamientos||[]).length;
    const sorted = (c.tratamientos||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const last = sorted[0]||null;
    return `
    <div class="client-card" onclick="nav('cliente-detail',{id:'${c.id}'})">
      <div class="client-card-name">${c.nombre}</div>
      <div class="client-card-sub">${c.telefono||''} ${c.email?'· '+c.email:''}</div>
      ${tratCount>0 ? `<div class="client-card-badge">${tratCount} visita${tratCount!==1?'s':''} · Último: ${last.servicio}</div>` : '<div class="client-card-badge" style="color:var(--gray);">Sin visitas registradas</div>'}
    </div>`;
  }).join('');
}

/* ── DETALLE CLIENTA ── */

  const c = state.clientes.find(x=>x.id===id);
  if(!c) return renderClientes();
  const tratas = state.tratCache[id];
  const loading = tratas === undefined;
  return `
  <div class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="nav('clientes')">${ic('chevron')}</button>
      <h2 style="font-size:14px;letter-spacing:1px;">${c.nombre.toUpperCase()}</h2>
      <button class="icon-btn" style="border:none;background:none;color:var(--gold);" onclick="openEditarClientaModal('${c.id}')">${ic('edit')}</button>
    </div>
    <div class="detail-header">
      <div class="detail-name">${c.nombre}</div>

function selectServicio(s, el){
  tratDraft.servicio = s;
  document.getElementById("trat-servicio").value = s;
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
function onTratFotosSelected(event){
  Array.from(event.target.files).forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{ tratDraft.fotos.push(e.target.result); renderTratFotosPreview(); };
    reader.readAsDataURL(file);
  });
}
function renderTratFotosPreview(){
  const el = document.getElementById("trat-fotos-preview");
  if(!el) return;
  el.innerHTML = `<div class="photo-grid">${tratDraft.fotos.map((f,i)=>`
    <div class="photo-thumb">
      <img src="${f}">
      <button class="photo-thumb-del" onclick="tratDraft.fotos.splice(${i},1);renderTratFotosPreview()">×</button>
    </div>`).join('')}</div>`;
}
async function guardarTratamiento(clienteId){
  const servicio = (document.getElementById("trat-servicio")?.value.trim())||tratDraft.servicio;
  if(!servicio){ toast("Ingresá el servicio"); return; }
  const data = {
    cliente_id: clienteId,
    fecha: document.getElementById("trat-fecha")?.value||new Date().toISOString().split('T')[0],
    servicio,
    productos: document.getElementById("trat-productos")?.value.trim()||"",
    obs: document.getElementById("trat-obs")?.value.trim()||"",
    fotos: tratDraft.fotos,
  };
  try{
    const [newT] = await sbFetch("tratamientos","POST",data,"return=representation");
    // Actualizar cache
    if(!state.tratCache[clienteId]) state.tratCache[clienteId]=[];
    state.tratCache[clienteId].unshift(newT);
    // Actualizar lista embebida del cliente
    const c = state.clientes.find(x=>x.id===clienteId);
    if(c){ if(!c.tratamientos) c.tratamientos=[]; c.tratamientos.push({id:newT.id,servicio:newT.servicio,fecha:newT.fecha}); }
    toast("Visita guardada");
    nav("cliente-detail",{id:clienteId});
  }catch(e){ console.error(e); toast("Error al guardar la visita"); }
}

async function guardarEditTrat(clienteId, tratId){
  const data = {
    servicio: document.getElementById("et-serv").value.trim(),
    productos: document.getElementById("et-prod").value.trim(),
    obs: document.getElementById("et-obs").value.trim(),
  };
  if(!data.servicio){ toast("El servicio es obligatorio"); return; }
  try{
    await sbFetch(`tratamientos?id=eq.${tratId}`,"PATCH",data);
    const tratas = state.tratCache[clienteId]||[];
    const t = tratas.find(x=>x.id===tratId); if(t) Object.assign(t,data);
    const c = state.clientes.find(x=>x.id===clienteId);
    const et = (c?.tratamientos||[]).find(x=>x.id===tratId); if(et) et.servicio=data.servicio;
    document.getElementById("trat-edit-overlay").remove();
    toast("Tratamiento actualizado");
    nav("tratamiento-detail",{clienteId,tratId});
  }catch(e){ console.error(e); toast("Error al guardar"); }
}
async function eliminarTratamiento(clienteId, tratId){
  if(!confirm("¿Eliminar este tratamiento?")) return;
  try{
    await sbFetch(`tratamientos?id=eq.${tratId}`,"DELETE");
    state.tratCache[clienteId]=(state.tratCache[clienteId]||[]).filter(t=>t.id!==tratId);
    const c = state.clientes.find(x=>x.id===clienteId);
    if(c) c.tratamientos=(c.tratamientos||[]).filter(t=>t.id!==tratId);
    toast("Eliminado");
    nav("cliente-detail",{id:clienteId});
  }catch(e){ console.error(e); toast("Error al eliminar"); }
}

async function guardarClienta(id){
  const nombre = document.getElementById("cm-nombre").value.trim();
  if(!nombre){ toast("El nombre es obligatorio"); return; }
  const data = {
    nombre,
    telefono: document.getElementById("cm-tel").value.trim(),
    email: document.getElementById("cm-email").value.trim(),
    direccion: document.getElementById("cm-dir").value.trim(),
    notas: document.getElementById("cm-notas").value.trim(),
    fecha_nacimiento: document.getElementById("cm-nacimiento").value||null,
  };
  try{
    if(id){
      await sbFetch(`clientes?id=eq.${id}`,"PATCH",data);
      const c = state.clientes.find(x=>x.id===id); if(c) Object.assign(c,data);
    } else {
      const [newC] = await sbFetch("clientes","POST",data,"return=representation");
      state.clientes.push({...newC, tratamientos:[]});
      state.clientes.sort((a,b)=>a.nombre.localeCompare(b.nombre));
    }
    document.getElementById("clienta-modal").remove();
    toast("Clienta guardada"); render();
  }catch(e){ console.error(e); toast("Error al guardar"); }
}
async function eliminarClienta(id){
  if(!confirm("¿Eliminar esta clienta y todo su historial?")) return;
  try{
    await sbFetch(`clientes?id=eq.${id}`,"DELETE");
    state.clientes = state.clientes.filter(c=>c.id!==id);
    delete state.tratCache[id];
    toast("Clienta eliminada"); nav("clientes");
  }catch(e){ console.error(e); toast("Error al eliminar"); }
}

      <div class="form-group">
        <label class="form-label">Fecha del turno</label>

      </div>

      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn-outline" style="flex:1;" onclick="document.getElementById('notif-fecha-modal').remove()">Cancelar</button>

      </div>

function actualizarPreviaNotif(){
  const fechaVal = document.getElementById("nf-fecha")?.value;
  const msg = document.getElementById("nf-msg")?.value||"";
  const el = document.getElementById("nf-preview-text");
  if(!el) return;
  let fechaTexto = fechaVal ? formatDate(fechaVal) : "{fecha}";
  el.textContent = msg.replace("{fecha}", fechaTexto);
}
function enviarNotifFecha(clienteId){
  const c = state.clientes.find(x=>x.id===clienteId);
  if(!c?.telefono) return;
  const fechaVal = document.getElementById("nf-fecha")?.value;
  const msg = document.getElementById("nf-msg")?.value?.trim()||"";
  if(!msg){ toast("Escribí el mensaje"); return; }
  const fechaTexto = fechaVal ? formatDate(fechaVal) : "";
  const texto = msg.replace("{fecha}", fechaTexto);
  const tel = c.telefono.replace(/\D/g,"");
  document.getElementById("notif-fecha-modal").remove();
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`,"_blank");
}

async function guardarProximaCita(clienteId){
  const data = {
    proxima_cita_fecha: document.getElementById("pc-fecha").value||null,
    proxima_cita_hora: document.getElementById("pc-hora").value||null,
    dias_aviso: parseInt(document.getElementById("pc-aviso").value)||2,
    msg_recordatorio: document.getElementById("pc-msg").value.trim(),
    msg_cumpleanos: document.getElementById("pc-cumple").value.trim(),
  };
  try{
    await sbFetch(`clientes?id=eq.${clienteId}`,"PATCH",data);
    const c = state.clientes.find(x=>x.id===clienteId);
    if(c) Object.assign(c,data);
    checkPendientes();
    document.getElementById("proxima-cita-modal").remove();
    toast("Cita guardada"); render();
  }catch(e){ console.error(e); toast("Error al guardar"); }
}
async function cancelarProximaCita(clienteId){
  if(!confirm("¿Cancelar la próxima cita agendada?")) return;
  try{
    await sbFetch(`clientes?id=eq.${clienteId}`,"PATCH",{proxima_cita_fecha:null,proxima_cita_hora:null});
    const c = state.clientes.find(x=>x.id===clienteId);
    if(c){ c.proxima_cita_fecha=null; c.proxima_cita_hora=null; }
    checkPendientes(); toast("Cita cancelada"); render();
  }catch(e){ console.error(e); toast("Error"); }
}
function enviarPendiente(i){
  const p = state.pendientes[i];
  const msg = document.getElementById(`pmsg-${i}`)?.value?.trim()||p.mensaje;
  state.pendienteMsgs[p.cliente.id+'_'+p.tipo] = msg;
  if(!p.cliente.telefono){ toast("La clienta no tiene teléfono"); return; }
  const tel = p.cliente.telefono.replace(/\D/g,"");
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,"_blank");
}

function previewNotif(){
  const clienteId=document.getElementById("notif-cliente")?.value;
  const msg=document.getElementById("notif-msg")?.value||"";
  const c=state.clientes.find(x=>x.id===clienteId);
  const texto=msg.replace("{nombre}",c?.nombre?.split(" ")[0]||"clienta");
  const el=document.getElementById("notif-preview");
  if(el) el.innerHTML=`<div class="notif-preview"><div class="notif-preview-label">Vista previa</div><div class="notif-preview-text">${texto}</div></div>`;
}
function enviarNotificacion(clienteId){
  const c=state.clientes.find(x=>x.id===clienteId);
  if(!c?.telefono){ toast("La clienta no tiene teléfono registrado"); return; }
  const tratas=state.tratCache[clienteId]||[];
  const last=tratas[0];
  const msg=`Hola ${c.nombre.split(" ")[0]}, fue un placer atenderte hoy en Salon Visagista. ✨${last?` Tu ${last.servicio.toLowerCase()} quedó impecable.`:''} ¡Te esperamos pronto!`;
  const tel=c.telefono.replace(/\D/g,"");
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,"_blank");
}
function enviarNotifCustom(){
  const clienteId=document.getElementById("notif-cliente")?.value;
  const msg=document.getElementById("notif-msg")?.value?.trim()||"";
  const c=state.clientes.find(x=>x.id===clienteId);
  if(!c){ toast("Seleccioná una clienta"); return; }
  if(!c.telefono){ toast("La clienta no tiene teléfono"); return; }
  if(!msg){ toast("Escribí el mensaje"); return; }
  const texto=msg.replace("{nombre}",c.nombre.split(" ")[0]);
  const tel=c.telefono.replace(/\D/g,"");
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`,"_blank");
}

function precargarKerastase(){
  let nuevos=0;
  KERASTASE_CATALOGO.forEach(item=>{
    const yaExiste=state.stockProductos.find(p=>p.codigo===item.codigo);
    if(yaExiste) return;
    state.stockProductos.push({
      id:'p'+Date.now()+Math.random().toString(36).slice(2),
      codigo:item.codigo,
      nombre:item.nombre,
      marca:'Kérastase',
      categoria:item.categoria,
      stockActual:0,
      stockMinimo:1,
      unidad:item.unidad,
      ultimoUpdate:new Date().toISOString(),
    });
    nuevos++;
  });
  saveStock();
  render();
  toast(nuevos>0?`${nuevos} productos Kérastase agregados`:'El catálogo Kérastase ya estaba cargado');
}

function loadStock(){
  try{
    state.stockProductos = JSON.parse(localStorage.getItem('vs_stock_prods')||'[]');
    state.stockMovimientos = JSON.parse(localStorage.getItem('vs_stock_movs')||'[]');
  }catch(e){}
}
function saveStock(){
  localStorage.setItem('vs_stock_prods', JSON.stringify(state.stockProductos));
  localStorage.setItem('vs_stock_movs', JSON.stringify(state.stockMovimientos));
}

function stockNivel(p){
  if(p.stockActual<=0) return 'out';
  if(p.stockActual<=p.stockMinimo) return 'low';
  return 'ok';
}
function stockBadge(p){
  const n=stockNivel(p);
  const labels={ok:p.stockActual+' '+p.unidad,low:'⚠ '+p.stockActual+' '+p.unidad,out:'Sin stock'};
  return `<span class="stock-badge ${n}">${labels[n]}</span>`;
}
const STOCK_CATS=['Shampoo','Acondicionador','Tintura','Crema / Tratamiento','Herramienta','Otro'];

function renderStock(){
  const prods = state.stockProductos;
  const sinStock = prods.filter(p=>stockNivel(p)==='out').length;
  const bajoStock = prods.filter(p=>stockNivel(p)==='low').length;

  // Agrupar por categoría
  const cats = {};
  prods.forEach(p=>{
    const c=p.categoria||'Otro';
    if(!cats[c]) cats[c]=[];
    cats[c].push(p);
  });

  let html=`<div class="screen">
  <div class="topbar">
    <div class="back-btn" onclick="navHome()">${ic('chevron')}</div>
    <h2>Stock</h2>
    <div onclick="nav('stock-form')" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold);">${ic('plus')}</div>
  </div>
  <div class="stock-summary">
    <div class="stock-stat"><div class="stock-stat-num">${prods.length}</div><div class="stock-stat-lbl">Productos</div></div>
    <div class="stock-stat"><div class="stock-stat-num" style="color:var(--danger)">${sinStock}</div><div class="stock-stat-lbl">Sin stock</div></div>
    <div class="stock-stat"><div class="stock-stat-num" style="color:#e6a817">${bajoStock}</div><div class="stock-stat-lbl">Stock bajo</div></div>
  </div>`;

  html+=`<div style="margin:0 20px 4px;text-align:right;">
    <button onclick="precargarKerastase()" style="background:transparent;border:1px solid rgba(201,169,110,0.35);color:var(--gold);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;cursor:pointer;">
      + Importar catálogo Kérastase
    </button>
  </div>`;

  if(prods.length===0){
    html+=`<div class="empty-state"><p>Sin productos</p><div class="empty-state-sub">Usá el botón + o el escáner para agregar</div></div>`;
  } else {
    Object.entries(cats).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([cat,items])=>{
      html+=`<div class="stock-cat-title">${cat}</div>`;
      items.sort((a,b)=>a.nombre.localeCompare(b.nombre)).forEach(p=>{
        html+=`<div class="stock-item" onclick="nav('stock-detalle',{id:'${p.id}'})">
          <div class="stock-item-left">
            <div class="stock-item-name">${p.nombre}</div>
            ${p.marca?`<div class="stock-item-brand">${p.marca}</div>`:''}
          </div>
          ${stockBadge(p)}
        </div>`;
      });
    });
  }
  html+=`</div>
  <button class="stock-fab" onclick="abrirScanner()" title="Escanear código">${ic('scan')}</button>`;
  return html;
}

        <input class="sform-input" id="sf-stock" type="number" min="0" placeholder="0" value="${p.stockActual??''}">
      </div>
      <div class="sform-group">
        <label class="sform-label">Stock mínimo</label>
        <input class="sform-input" id="sf-min" type="number" min="0" placeholder="0" value="${p.stockMinimo??''}">
        <div class="sform-hint">Avisa cuando baje de este valor</div>
      </div>
    </div>
    <div class="sform-group">
      <label class="sform-label">Unidad</label>
      <select class="sform-select" id="sf-unidad">
        ${['unid','ml','lt','gr','kg','caja','par'].map(u=>`<option value="${u}" ${(p.unidad||'unid')===u?'selected':''}>${u}</option>`).join('')}
      </select>
    </div>
    <button class="sform-btn" onclick="guardarProducto(${editId?`'${editId}'`:'null'})">${editId?'Guardar cambios':'Agregar producto'}</button>
  </div>
  </div>`;
}

function guardarProducto(editId){
  const nombre = document.getElementById('sf-nombre').value.trim();
  if(!nombre){ toast('Ingresá el nombre del producto'); return; }
  const stock = parseInt(document.getElementById('sf-stock').value)||0;
  const prod = {
    id: editId || ('p'+Date.now()),
    codigo: document.getElementById('sf-codigo').value.trim(),
    nombre,
    marca: document.getElementById('sf-marca').value.trim(),
    categoria: document.getElementById('sf-cat').value,
    stockActual: stock,
    stockMinimo: parseInt(document.getElementById('sf-min').value)||0,
    unidad: document.getElementById('sf-unidad').value,
    ultimoUpdate: new Date().toISOString(),
  };
  if(editId){
    const idx = state.stockProductos.findIndex(x=>x.id===editId);
    if(idx>=0) state.stockProductos[idx]=prod;
  } else {
    state.stockProductos.push(prod);
    if(stock>0){
      state.stockMovimientos.push({id:'m'+Date.now(),productoId:prod.id,tipo:'entrada',cantidad:stock,fecha:new Date().toISOString(),nota:'Stock inicial'});
    }
  }
  saveStock();
  state.stockFormPrefill = null;
  toast(editId?'Producto actualizado':'Producto agregado');
  nav('stock-detalle',{id:prod.id});
}

function eliminarProducto(id){
  if(!confirm('¿Eliminar este producto y su historial?')) return;
  state.stockProductos = state.stockProductos.filter(p=>p.id!==id);
  state.stockMovimientos = state.stockMovimientos.filter(m=>m.productoId!==id);
  saveStock();
  toast('Producto eliminado');
  nav('stock');
}

// ── MOVIMIENTOS ──────────────────────────────
function abrirMovModal(productoId, tipo){
  state.stockQty = 1;
  state.stockNota = '';
  const p = state.stockProductos.find(x=>x.id===productoId);
  const color = tipo==='entrada'?'var(--success)':'var(--danger)';
  const label = tipo==='entrada'?'+ Entrada':'− Salida';
  const overlay = document.createElement('div');
  overlay.className='qty-overlay'; overlay.id='mov-overlay';
  overlay.innerHTML=`<div class="qty-sheet">
    <h3 style="color:${color}">${label}</h3>
    <div class="sub">${p.nombre}</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="cambiarQty(-1)">−</button>
      <div class="qty-num" id="qty-display">1</div>
      <button class="qty-btn" onclick="cambiarQty(1)">+</button>
    </div>
    <input class="qty-nota" id="qty-nota" placeholder="Nota opcional (proveedor, motivo...)" oninput="state.stockNota=this.value">
    <button class="mov-confirm-btn ${tipo}" onclick="confirmarMovimiento('${productoId}','${tipo}')">Confirmar ${label}</button>
    <button onclick="cerrarMovModal()" style="width:100%;padding:14px;margin-top:8px;background:transparent;border:1px solid var(--glass-bd);color:var(--gray);cursor:pointer;font-size:12px;letter-spacing:1px;">Cancelar</button>
  </div>`;
  document.body.appendChild(overlay);
}
function cambiarQty(d){
  state.stockQty = Math.max(1, (state.stockQty||1)+d);
  const el=document.getElementById('qty-display');
  if(el) el.textContent=state.stockQty;
}
function cerrarMovModal(){ const el=document.getElementById('mov-overlay'); if(el) el.remove(); }
function confirmarMovimiento(productoId, tipo){
  const qty = state.stockQty||1;
  const p = state.stockProductos.find(x=>x.id===productoId);
  if(!p) return;
  if(tipo==='salida' && p.stockActual<qty){ toast('Stock insuficiente'); return; }
  p.stockActual += tipo==='entrada' ? qty : -qty;
  p.ultimoUpdate = new Date().toISOString();
  state.stockMovimientos.push({
    id:'m'+Date.now(),
    productoId,
    tipo,
    cantidad: qty,
    fecha: new Date().toISOString(),
    nota: state.stockNota||''
  });
  saveStock();
  cerrarMovModal();
  toast(tipo==='entrada'?`+${qty} registrado`:`-${qty} registrado`);
  nav('stock-detalle',{id:productoId});
}

// ── ESCÁNER (ZXing + BarcodeDetector nativo) ────────────────────────

function abrirScanner(){
  cerrarScanner();

  const st = document.createElement('style');
  st.id = '_scan-style';
  st.textContent = `
    @keyframes scanLine{0%{top:4%}50%{top:96%}100%{top:4%}}
    #sv-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
    #scan-status{transition:opacity .3s;}
    .scan-corner{position:absolute;width:22px;height:22px;}
    .scan-corner.tl{top:-2px;left:-2px;border-top:3px solid var(--gold2);border-left:3px solid var(--gold2);}
    .scan-corner.tr{top:-2px;right:-2px;border-top:3px solid var(--gold2);border-right:3px solid var(--gold2);}
    .scan-corner.bl{bottom:-2px;left:-2px;border-bottom:3px solid var(--gold2);border-left:3px solid var(--gold2);}
    .scan-corner.br{bottom:-2px;right:-2px;border-bottom:3px solid var(--gold2);border-right:3px solid var(--gold2);}
    .scan-beam{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanLine 2s ease-in-out infinite;box-shadow:0 0 6px var(--gold);}
    #torch-btn.on{color:var(--gold)!important;}
  `;
  document.head.appendChild(st);

  const ov = document.createElement('div');
  ov.id = 'scanner-overlay';
  ov.style.cssText='position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;touch-action:none;';
  ov.innerHTML=`
    <div id="scan-vp" style="flex:1;position:relative;overflow:hidden;background:#000;">
      <video id="sv-video" autoplay playsinline muted></video>
      <!-- sombra alrededor del recuadro -->
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
        <div style="position:absolute;inset:0;background:rgba(0,0,0,.55);"></div>
        <div id="scan-box" style="position:relative;width:80%;max-width:320px;aspect-ratio:1.8/1;z-index:1;background:transparent;">
          <div style="position:absolute;inset:0;background:transparent;outline:999px solid rgba(0,0,0,.55);"></div>
          <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div><div class="scan-corner br"></div>
          <div class="scan-beam"></div>
        </div>
      </div>
      <!-- topbar -->
      <div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(rgba(0,0,0,.7),transparent);z-index:2;">
        <span style="color:var(--gold);font-size:10px;letter-spacing:3px;text-transform:uppercase;">Escanear</span>
        <div style="display:flex;gap:14px;align-items:center;">
          <span id="torch-btn" onclick="toggleTorch()" style="color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;" title="Linterna">⚡</span>
          <span onclick="cerrarScanner()" style="color:#fff;font-size:26px;line-height:1;cursor:pointer;">✕</span>
        </div>
      </div>
      <!-- status -->
      <div id="scan-status" style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:1px;z-index:2;">Iniciando cámara...</div>
    </div>
    <!-- panel inferior -->
    <div style="background:#0a0a0a;border-top:1px solid rgba(201,169,110,.2);padding:14px 16px;">
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input id="scan-input" type="text" inputmode="numeric" placeholder="O escribí el código manualmente"
          style="flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(201,169,110,.3);color:#fff;padding:12px 14px;font-size:14px;font-family:'Montserrat',sans-serif;outline:none;border-radius:2px;">
        <button onclick="usarCodigoManual()" style="background:var(--gold);color:#000;border:none;padding:12px 18px;font-weight:700;font-size:11px;cursor:pointer;">OK</button>
      </div>
      <button onclick="cerrarScanner()" style="width:100%;padding:10px;background:transparent;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-size:10px;letter-spacing:2px;cursor:pointer;">CANCELAR</button>
    </div>`;
  document.body.appendChild(ov);

  // Iniciar: BarcodeDetector nativo primero, luego ZXing como fallback
  if('BarcodeDetector' in window){
    iniciarNativo();
  } else {
    cargarZXing();
  }
}

function setScanStatus(txt){ const el=document.getElementById('scan-status'); if(el) el.textContent=txt; }

// ── Motor 1: BarcodeDetector nativo ──
async function iniciarNativo(){
  const video = document.getElementById('sv-video');
  if(!video) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} }
    });
    state.scannerStream = stream;
    video.srcObject = stream;
    await video.play();

    // intentar torch
    const track = stream.getVideoTracks()[0];
    state._scanTrack = track;

    const detector = new BarcodeDetector({
      formats:['ean_13','ean_8','code_128','upc_a','upc_e','code_39','qr_code','data_matrix']
    });
    setScanStatus('Apuntá al código de barras o QR');
    let active = true;
    const loop = async () => {
      if(!active || !document.getElementById('scanner-overlay')) return;
      try {
        const r = await detector.detect(video);
        if(r.length > 0){
          active = false;
          navigator.vibrate?.([60,30,60]);
          cerrarScanner();
          procesarCodigo(r[0].rawValue);
          return;
        }
      } catch(e){}
      setTimeout(loop, 150);
    };
    setTimeout(loop, 800);
  } catch(e){
    setScanStatus('Sin acceso a cámara — escribí el código');
  }
}

// ── Motor 2: ZXing (fallback) ──
function cargarZXing(){
  setScanStatus('Cargando escáner...');
  if(window.ZXing){ iniciarZXing(); return; }
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js';
  s.onload = iniciarZXing;
  s.onerror = () => setScanStatus('Sin conexión — escribí el código manualmente');
  document.head.appendChild(s);
}

async function iniciarZXing(){
  const video = document.getElementById('sv-video');
  if(!video || !window.ZXing) return;
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const reader = new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts:150, delayBetweenScanSuccess:500 });
    state.zxingReader = reader;

    const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
    const back = devices.find(d=>/back|rear|environment/i.test(d.label)) || devices[devices.length-1];

    setScanStatus('Apuntá al código de barras o QR');
    await reader.decodeFromVideoDevice(back?.deviceId||null, video, (result, err) => {
      if(!result) return;
      navigator.vibrate?.([60,30,60]);
      const code = result.getText();
      cerrarScanner();
      procesarCodigo(code);
    });

    const track = video.srcObject?.getVideoTracks()[0];
    if(track) state._scanTrack = track;
  } catch(e){
    setScanStatus('Error al iniciar cámara — escribí el código');
  }
}

// ── Linterna ──
let _torchOn = false;
function toggleTorch(){
  if(!state._scanTrack) return;
  _torchOn = !_torchOn;
  state._scanTrack.applyConstraints({advanced:[{torch:_torchOn}]}).catch(()=>{});
  const btn = document.getElementById('torch-btn');
  if(btn) btn.classList.toggle('on', _torchOn);
}

function cerrarScanner(){
  _torchOn = false;
  try{ if(state.zxingReader){ state.zxingReader.reset(); state.zxingReader=null; } }catch(e){}
  try{ if(window.Quagga) Quagga.stop(); }catch(e){}
  if(state.scannerStream){ state.scannerStream.getTracks().forEach(t=>t.stop()); state.scannerStream=null; }
  state._scanTrack = null;
  document.getElementById('scanner-overlay')?.remove();
  document.getElementById('_scan-style')?.remove();
}

function usarCodigoManual(){
  const val=(document.getElementById('scan-input').value||'').trim();
  if(!val){ toast('Ingresá un código'); return; }
  cerrarScanner();
  procesarCodigo(val);
}

async function procesarCodigo(codigo){
  // ¿Ya existe en el stock?
  const existe = state.stockProductos.find(p=>p.codigo===codigo);
  if(existe){
    toast('Producto encontrado');
    nav('stock-detalle',{id:existe.id});
    return;
  }
  // Buscar en Open Beauty Facts (cosméticos)
  toast('Buscando producto...');
  let prefill = {codigo};
  try{
    const r = await fetch(`https://world.openbeautyfacts.org/api/v0/product/${codigo}.json`);
    const data = await r.json();
    if(data.status===1 && data.product){
      const dp = data.product;
      prefill.nombre = dp.product_name_es || dp.product_name || '';
      prefill.marca = dp.brands || '';
      const tags = (dp.categories_tags||[]).join(' ').toLowerCase();
      if(tags.includes('shampoo')) prefill.categoria='Shampoo';
      else if(tags.includes('conditioner')||tags.includes('acondicionador')) prefill.categoria='Acondicionador';
      else if(tags.includes('dye')||tags.includes('color')||tags.includes('tintura')) prefill.categoria='Tintura';
      else if(tags.includes('cream')||tags.includes('mask')||tags.includes('treatment')) prefill.categoria='Crema / Tratamiento';
      if(prefill.nombre) toast(`Producto: ${prefill.nombre}`);
      else toast('Código detectado — completá los datos');
    } else {
      toast('Código detectado — completá los datos');
    }
  }catch(e){ toast('Código detectado — completá los datos'); }
  state.stockFormPrefill = prefill;
  nav('stock-form');
}

/* ── VIEWER FOTO ── */
function openPhotoViewer(clienteId,tratId,idx){
  const tratas=state.tratCache[clienteId]||[];
  const t=tratas.find(x=>x.id===tratId);
  if(!t?.fotos) return;
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;";
  overlay.onclick=()=>overlay.remove();
  overlay.innerHTML=`<img src="${t.fotos[idx]}" style="max-width:100%;max-height:100%;object-fit:contain;">`;
  document.body.appendChild(overlay);
}

/* ── UTILS ── */
function formatDate(d){
  if(!d) return "";
  const [y,m,day]=d.split("-");
  const months=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return `${day} ${months[parseInt(m)-1]} ${y}`;
}

loadLocalState();
loadStock();
render();
if(state.authed) loadClientes();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
